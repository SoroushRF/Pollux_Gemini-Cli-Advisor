id: pollux-v1-cross-contract-brutal-02
family: cross_file_contract_repair
difficulty: medium
source: swebench_archetype_nested_contract_repair_v1_3
prompt: "Repair the nested render contract so parser.mjs remains the canonical raw parser, resolver.mjs owns kind/status aliases, normalizer.mjs uses both parser and resolver, optional meta is parsed, and renderer.mjs follows docs/render-contract.md. Do not edit docs or tests_public."
timeout_sec: 300
protected_files:
  - docs/**
  - tests_public/**
visible_files:
  - src/**
  - docs/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
