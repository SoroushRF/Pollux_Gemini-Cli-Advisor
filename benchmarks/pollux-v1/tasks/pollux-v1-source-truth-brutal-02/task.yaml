id: pollux-v1-source-truth-brutal-02
family: source_of_truth_conflict_resolution
difficulty: hard
source: swebench_archetype_precedence_fallback_v1_3
prompt: "Resolve runtimeDecision in src/decision.mjs using rules/precedence.md. Implement resolveRuntimeDecision(optionalSources) so the same precedence works for injected source objects and repository config files. Do not edit config, plans, docs, rules, or tests_public."
timeout_sec: 300
protected_files:
  - config/**
  - plans/**
  - docs/**
  - rules/**
  - tests_public/**
visible_files:
  - src/**
  - config/**
  - plans/**
  - docs/**
  - rules/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - v1.3
  - brutal-hard
  - source-of-truth
  - precedence
