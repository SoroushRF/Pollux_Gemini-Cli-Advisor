id: pollux-v1-source-truth-medium-02
family: source_of_truth_conflict_resolution
difficulty: medium
source: swebench_archetype_config_precedence_v1_3
prompt: "Update src/policy.mjs so exported policy follows config/policy.json with config/defaults.json fallback, and expose resolvePolicy({ policy, defaults }) for the same precedence behavior. Do not edit config, docs, or tests_public."
timeout_sec: 300
protected_files:
  - config/**
  - docs/**
  - tests_public/**
visible_files:
  - src/**
  - config/**
  - docs/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - v1.3
  - medium
  - source-of-truth
  - fallback
