id: pollux-v1-guarded-migration-brutal-01
family: guarded_migration_compatibility
difficulty: hard
source: rewritten_from_m3_bm_24_and_m3_bm_20_v1_2
prompt: "Migrate the shade formatter to canonical renderShade across source internals while preserving formatShade as a public compatibility alias. Update source registry wiring. Do not edit docs or tests_public."
timeout_sec: 300
protected_files:
  - docs/**
  - tests_public/**
visible_files:
  - src/**
  - docs/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - brutal-hard
  - compatibility-migration
  - hidden-tests
  - task-local-npm
