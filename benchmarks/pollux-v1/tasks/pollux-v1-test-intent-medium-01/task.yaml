id: pollux-v1-test-intent-medium-01
family: test_intent_edge_bugfix
difficulty: medium
source: rewritten_from_m3_bm_15
prompt: "Repair src/flow.mjs so the state machine follows tests and docs. Done and failed are terminal states. Queued work must enter running before completion. Do not edit tests or docs."
timeout_sec: 300
protected_files:
  - docs/**
  - tests/**
visible_files:
  - src/**
  - docs/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - test-intent
  - state-machine
  - hidden-tests
  - deterministic

