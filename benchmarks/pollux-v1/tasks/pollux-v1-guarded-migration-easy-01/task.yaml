id: pollux-v1-guarded-migration-easy-01
family: guarded_migration_compatibility
difficulty: easy_control
source: new_easy_control
prompt: "Rename the internal helper from buildName to createName in source files. Keep buildName exported as a compatibility alias. Do not edit tests."
timeout_sec: 300
protected_files:
  - tests/**
visible_files:
  - src/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - guarded-migration
  - easy-control
  - compatibility
  - hidden-tests

