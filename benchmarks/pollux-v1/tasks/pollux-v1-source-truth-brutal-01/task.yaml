id: pollux-v1-source-truth-brutal-01
family: source_of_truth_conflict_resolution
difficulty: hard
source: rewritten_from_m3_bm_14_v1_2
prompt: "Resolve runtimeDecision in src/decision.mjs using rules/precedence.md. Do not edit config, plans, docs, rules, or tests_public."
timeout_sec: 300
protected_files:
  - config/**
  - plans/**
  - docs/**
  - rules/**
  - tests_public/**
visible_files:
  - src/**
  - config/**
  - plans/**
  - docs/**
  - rules/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - brutal-hard
  - source-of-truth
  - precedence
  - task-local-npm
