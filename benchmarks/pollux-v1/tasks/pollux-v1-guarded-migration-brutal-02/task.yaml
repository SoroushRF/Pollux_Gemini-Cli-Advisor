id: pollux-v1-guarded-migration-brutal-02
family: guarded_migration_compatibility
difficulty: hard
source: swebench_archetype_multi_surface_compat_migration_v1_3
prompt: "Migrate the shade formatter to canonical renderShade across source internals while preserving formatShade compatibility across registry and compatibility surfaces. Update registry metadata. Do not edit docs or tests_public."
timeout_sec: 300
protected_files:
  - docs/**
  - tests_public/**
visible_files:
  - src/**
  - docs/**
  - tests_public/**
hidden_tests:
  fail_to_pass_command:
    - node
    - tests/fail_to_pass/check.mjs
  pass_to_pass_command:
    - node
    - tests/pass_to_pass/check.mjs
success:
  requires_fail_to_pass: true
  requires_pass_to_pass: true
  requires_protected_hashes: true
tags:
  - v1.3
  - brutal-hard
  - compatibility-migration
  - registry-metadata
